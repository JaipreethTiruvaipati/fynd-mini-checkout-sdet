<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Checkout</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <h1>Mini Checkout</h1>

    <section aria-labelledby="products-heading" class="card">
      <h2 id="products-heading">Products</h2>
      <p id="products-status" class="muted" role="status">Loading products…</p>
      <ul id="product-list" class="product-list"></ul>
    </section>

    <section aria-labelledby="cart-heading" class="card" id="cart-section">
      <h2 id="cart-heading">Your cart</h2>
      <p id="cart-empty" class="muted">Your cart is empty.</p>
      <table id="cart-table" hidden>
        <thead>
          <tr>
            <th scope="col">Item</th>
            <th scope="col">Unit price</th>
            <th scope="col">Quantity</th>
            <th scope="col">Line total</th>
            <th scope="col"><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody id="cart-body"></tbody>
      </table>
      <p class="order-total">
        Order total: <strong id="order-total" data-testid="order-total" aria-live="polite">₹0.00</strong>
      </p>
    </section>

    <section aria-labelledby="details-heading" class="card" id="checkout-section">
      <h2 id="details-heading">Your details</h2>
      <form id="checkout-form" novalidate>
        <label for="customer-name">Full name <span aria-hidden="true">*</span></label>
        <input id="customer-name" name="customerName" type="text" autocomplete="name"
               required aria-required="true" aria-describedby="form-error" maxlength="80" />
        <div id="form-error" class="error" role="alert"></div>
        <button id="place-order" type="submit">Place order</button>
      </form>
    </section>

    <section id="confirmation" class="card success" hidden aria-labelledby="confirmation-heading">
      <h2 id="confirmation-heading" tabindex="-1">Order confirmed</h2>
      <p>Thank you, <span id="confirm-name"></span>. Your order has been placed.</p>
      <p>Order reference: <strong id="order-reference" data-testid="order-reference"></strong></p>
      <p>Amount: <strong id="confirm-total" data-testid="confirm-total"></strong></p>
      <button id="new-order" type="button">Start a new order</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
